<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLM image · TrajLab admin</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin">
{% set active = 'vlm' %}{% include "_admin_nav.html" %}
<main class="admin-main">
  <div class="row" style="justify-content:space-between;margin-bottom:.8rem">
    <a class="btn btn-quiet" href="/admin#vlm">All VLM images</a>
    <div style="flex:1;min-width:200px">
      <h2 id="title" style="margin:0"></h2>
      <div class="small muted" id="subtitle"></div>
    </div>
    <label class="check"><input type="checkbox" id="in-rating"><span>Shown in rating tasks</span></label>
  </div>

  <div class="scene-layout">
    <div>
      <div class="stage">
        <div id="stage-host"></div>
        <div class="stage-tools">
          <div class="seg seg-dark" id="mode-seg" role="group" aria-label="Mode">
            <button type="button" data-v="view" aria-pressed="true">View</button>
            <button type="button" data-v="trace" aria-pressed="false">Trace the path</button>
          </div>
          <span id="trace-tools" hidden style="display:contents">
            <div class="seg seg-dark" id="t-style"><button type="button" data-v="line" aria-pressed="false">Straight lines</button><button type="button" data-v="curve" aria-pressed="true">Curves</button></div>
            <button class="btn" id="t-undo">Undo</button>
            <button class="btn" id="t-clear">Clear</button>
            <span class="spacer"></span>
            <button class="btn is-on" id="t-save">Save traced path</button>
          </span>
        </div>
        <p class="stage-hint" id="hint"></p>
      </div>
      <div class="card" id="metrics-card" style="margin-top:1rem" hidden>
        <h3>Compared with what people drew</h3>
        <dl class="kv" id="metrics"></dl>
      </div>
    </div>

    <aside>
      <div class="card"><h3>Ratings</h3><div id="ratings"><p class="muted small">Loading…</p></div></div>
      <div class="card"><h3>Rules raters said it breaks</h3><div id="norms"></div></div>
      <div class="card" id="comments-card" hidden><h3>Comments</h3><ul id="comments" class="small" style="padding-left:1.1rem;margin:0"></ul></div>
      <form class="card" id="meta-form">
        <h3>Details</h3>
        <label class="field"><span>Model</span><input type="text" name="model"></label>
        <label class="field"><span>Training image</span><select name="scene_id"></select></label>
        <div class="row">
          <label class="field" style="flex:1"><span>Source</span><select name="source">
            <option value="vlm">VLM</option><option value="baseline">Baseline planner</option><option value="team">Team consensus</option><option value="other">Other</option></select></label>
          <label class="field" style="flex:1"><span>The model chose to</span><select name="decision"><option value="path">Move</option><option value="wait">Wait</option></select></label>
        </div>
        <label class="field"><span>Model's explanation (optional)</span><textarea name="rationale" rows="3"></textarea></label>
        <p class="tiny muted" id="file-info"></p>
        <div class="row" style="justify-content:space-between">
          <button class="btn btn-primary" type="submit">Save details</button>
          <button class="btn btn-danger" type="button" id="delete">Delete</button>
        </div>
      </form>
    </aside>
  </div>
</main>
<script>window.CANDIDATE_ID = {{ candidate_id | tojson }};</script>
<script src="{{ url_for('static', filename='js/geometry.js') }}"></script>
<script src="{{ url_for('static', filename='js/pathcanvas.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin_common.js') }}"></script>
<script src="{{ url_for('static', filename='js/admin_vlm.js') }}"></script>
</body>
</html>
