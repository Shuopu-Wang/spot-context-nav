<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign-in</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin">
<main class="login">
  <form method="post" class="card" style="padding:1.5rem">
    <h1 style="font-size:1.6rem">Research team sign-in</h1>
    <p class="muted small">Participants don't need this page. Send them the main link instead.</p>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    {% if default_pw %}<div class="alert alert-warn small">The admin password is still the default (<code>changeme</code>). Set <code>ADMIN_PASSWORD</code> before sharing the site publicly.</div>{% endif %}
    <label class="field"><span>Password</span><input type="password" name="password" autofocus autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
