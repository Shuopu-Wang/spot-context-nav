<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ settings.study_title }}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20 C 5 12, 18 14, 17 5" fill="none" stroke="#ff2d87" stroke-width="2.6" stroke-linecap="round"/><circle cx="5" cy="20" r="3.2" fill="#2459ff"/><path d="M17 6 L17 1.5 L21.5 3 Z" fill="#1f9d55"/></svg>
    <span>{{ settings.study_title }}</span>
  </div>
  <div class="progress" id="progress" hidden>
    <span id="who" class="who"></span>
    <span id="progress-text" class="num"></span>
    <div class="progress-bar" aria-hidden="true"><i id="progress-fill" style="width:0%"></i></div>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<script id="settings" type="application/json">{{ settings | tojson }}</script>
<script src="{{ url_for('static', filename='js/geometry.js') }}"></script>
<script src="{{ url_for('static', filename='js/pathcanvas.js') }}"></script>
<script src="{{ url_for('static', filename='js/participant.js') }}"></script>
</body>
</html>
